name: Build OBS Plugin

on:
  push:
    paths:
      - 'obs-plugin/**'
  pull_request:
    paths:
      - 'obs-plugin/**'
  workflow_dispatch:

jobs:
  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install OBS SDK + Qt6
        run: |
          sudo add-apt-repository -y ppa:obsproject/obs-studio
          sudo apt-get update -qq
          sudo apt-get install -y \
            obs-studio qt6-base-dev libcurl4-openssl-dev \
            cmake ninja-build pkg-config

      - name: Configure
        run: cmake -S obs-plugin -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rgb-obs-plugin-linux-x86_64
          path: build/librgb-obs-plugin.so
          if-no-files-found: warn

  macos:
    name: macOS (Universal)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Homebrew deps
        run: brew install cmake ninja ccache jq

      - name: Build plugin (via obs-plugintemplate-style CMake)
        run: |
          chmod +x obs-plugin/build-macos.sh
          cd obs-plugin
          ./build-macos.sh
        env:
          CI: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rgb-obs-plugin-macos-universal
          path: obs-plugin/build/librgb-obs-plugin.so
          if-no-files-found: warn
